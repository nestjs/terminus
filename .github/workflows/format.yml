name: Format

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-26.04
    strategy:
      matrix:
        node-version: [20]

    steps:
    - uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - run: pnpm i
    - run: pnpm format